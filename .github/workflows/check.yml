name: Build and domain tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - run: npm run syntax
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run export:mobile
