name: Build and domain tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Endast versionshanterade filer. Inga hemligheter eller kunddata arkiveras.
      - name: Archive source for reproducible verification
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/yehabibi-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.sha }}
          path: ${{ runner.temp }}/yehabibi-source.zip
          retention-days: 3
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit exact lock and expiring reviewed residual risks
        run: node scripts/security-audit.mjs
      - name: Preserve audit evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: .tmp/security-audit/*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run syntax
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Production HTTP, server rendering and disabled demo checks
        run: npm run test:web
      - run: npm run export:mobile
      - name: Public Metro denies private JSON entries, source maps and asset traversal
        run: npm run test:metro
      - name: Install pinned PostgREST for isolated database tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/yehabibi-test-tools"
          curl --fail --location --retry 3 https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz --output "$RUNNER_TEMP/yehabibi-test-tools/postgrest.tar.xz"
          echo "b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  $RUNNER_TEMP/yehabibi-test-tools/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/yehabibi-test-tools/postgrest.tar.xz" -C "$RUNNER_TEMP/yehabibi-test-tools"
          echo "POSTGREST_BIN=$RUNNER_TEMP/yehabibi-test-tools/postgrest" >> "$GITHUB_ENV"
          echo "PG_BIN=$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -n 1)")" >> "$GITHUB_ENV"
      - name: Real PostgreSQL, PostgREST and Next HTTP flow
        run: npm run test:integration
      - name: Isolated test orders, simulation, notifications and security boundaries
        run: npm run test:mode
      - name: Direct packages, atomic slot capacity and simulated payments
        run: npm run test:direct
      - name: Independent scheduled worker, crash recovery and kitchen alarms without browsers
        run: npm run test:background
      - name: Private remote gateway, synthetic payments, denied internals and preserved orders after restart
        run: npm run test:remote
      - name: Database test diagnostics on failure
        if: failure()
        shell: bash
        run: |
          find .tmp -type f \( -name 'postgres.log' -o -name 'process-*.log' \) | while IFS= read -r file; do tail -n 60 "$file"; done
